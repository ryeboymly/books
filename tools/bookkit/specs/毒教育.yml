  - - 446
    - 群里的一场争论
    - 布老师你好！今天我们在群里激烈地讨论一个问题。我想听听您的看法。群里的几个妈妈有的说孩子应该去学古典音乐，这样可以陶冶情操，培养专注力。但是有几个妈妈说学习古典音乐没什么用，小孩子就应该去玩，宁可多睡觉。我家的情况是这样的：我女儿现在 7 岁，2 年前开始让她学钢琴。现在她已经会弹一些曲子了，但是弹的一般，并不是出类拔萃那一种。我家在上海属于中等家庭，虽然有几套房子，但是并不很富裕，也不穷。我不想让孩子走音乐这条路，只是想培养她的一些爱好。但是我女儿上小学之后，学校教的东西比较多，因为是私立小学，大家都很拼，所以她平时玩的时间就更少了。她不喜欢弹钢琴，每次去学钢琴她都要和我讨价还价。她曾经说妈妈你让我去学钢琴我不开心，我想看电视，想出去玩。我也很心疼她，但是我想学习乐器不要半途而废。您怎么看这件事？
