manual:
  658: 我不知道是我上了大学，还是大学上了我‖‖最近网上在讨论一个话题：“如果清华北大毕业的都买不起学区房，那么买学区房有啥用？”——这种振振有词的论调被广为转发，足以证明在网民中，智商实在是稀缺物。今天就来谈谈，这个论调错在哪里？首先，大学不是教你赚钱的地方。清华北大更不是教你如何赚钱的地方。如果想学赚钱，就不要来上大学，应该直接选择蓝翔，去学开挖掘机，学炒菜，学修车、电焊、美容美发。随到随学，包教包会，学成毕业马上就能赚钱。现在大城市有的技工的起薪都是一万以上，干几年之后，自己做小老板。
  2: 'Universal education is the most corroding and disintegrating poison that liberalism has ever invented for its own destruction.

    —— Adolf Hitler

    译：普及性的初等教育（即义务教育）是自由主义为自身毁灭曾经发明的最为腐蚀和分裂性的毒药。'
  4: 布老师，如果家长精力跟不上，只能去公立学校接受那种洗脑教育的环境下，如何保证儿童正确的三观？——浩‖p‖你好！感谢你给我提出这个问题。‖p‖解毒是一辈子的事情。在人生的任何时期，我们都需要和错误的观念进行斗争。在学校，在家庭，在社会上，网络上，每时每刻，我们都在接触错误的观点。如果观点可以用可视化的方式展现出来，我们会看到这个世界处处都是吐火的恶龙。稍不留神，就会被这些恶龙咬住，拖入人生的泥潭，几代人都无法翻身。
  662: 不信可以看今天的招聘信息：司机、装卸工、电焊工的月薪普遍标到八千到一万二，还包吃住，学历不限。
  126: 如果你指出政府强加给各行各业的管制，例如硬性规定各个行业的质量标准，禁止没有资质的经营者进入市场，那么你会不会被那些被管制的人骂得狗血淋头？
  254: 你希望你的小孩子用什么方式与别人沟通，就要用什么方式和他沟通。谈到沟通，就不得不提《论语》里的一句话：不教而杀谓之虐。
  476: 贵族与平民的差别有多大？非常非常大，简直就是两个世界。
  598: 根据相关数据统计，在全球 500 强企业家当中，犹太人占了 50% 以上。
  666: 上海应届本科生月薪达 4000 元，研究生超 5000 元。
  668: 业内透露，与去年相比，今年应届生的薪酬略微提高，平均涨幅每月 200 元左右。其中，研究生的月薪更高一些。
  192: 以上的这些问题可以归纳成六个维度：父母的意愿、家庭的硬实力、孩子的意愿、孩子的身体与精神承受力、孩子的智商与学习能力、父母能给孩子的资源。这六个维度，决定了一个家庭到底适不适合走精英路线。
  534: ''
  134: '‖e‖I know it is the fashion to say that most of recorded history is lies anyway. I am willing to believe that history is for the most part inaccurate and biased, but what is peculiar to our own
    age is the abandonment of the idea that history could be truthfully written.

    —— George Orwell（乔治·奥威尔）

    译：我知道现在很流行这样的观点，那就是：现存大部分的历史都是谎言。'
  310: '‖e‖SUCCESS CONSISTS OF GOING FROM FAILURE TO FAILURE WITHOUT LOSS OF ENTHUSIASM.

    —— Winston Churchill（温斯顿·丘吉尔）

    译：成功就是从失败走向失败，而不曾丧失热情。'
  418: '‖e‖The greatest gifts you can give your children are the roots of responsibility and the wings of independence.

    —— Denis Waitley（丹尼斯·威特利）

    译：你能给孩子的最好的礼物，是责任的根基与独立的翅膀。‖p‖布老师你好！希望能向你咨询一个问题。我是北方人，今年 29 岁，在深圳的一个房地产开发商工作。我男朋友是广州人，在广州工作，31 岁，建筑师。我们恋爱已经 2 年多，彼此都很有好感，打算结婚了。可是现在遇到一个问题，就是他的家长不同意我们在一起，更不同意我们结婚。我们本来很相爱，现在遇到这样的问题，感觉已经有了一丝的裂痕。我父母很支持我们在一起，但是我却不知道该怎么办。我是该继续等下去，还是该离开他？如果离开的话，你能帮我介绍男朋友吗？'
  186: 1、你是否居住在拥有优质教育资源的城市？你的家庭是否有实力（金钱、社会关系等）支撑孩子上名校、出国留学？⁂- 2、你们是否想要孩子成为社会普遍认可的“精英”？
  188: 3、孩子是否愿意牺牲自己玩耍的时间，起早贪黑地学习奋斗？⁂- 4、孩子的身体和精神能否承受超强的竞争压力？
  190: 5、孩子的智商和学习能力是否能够超过其他想要成为“精英”的孩子？⁂- 6、你们是否有能力给孩子提供优质的家庭教育？
  174: 3、我们生养孩子，是为了培养具有健全人格的人，还是为了培养逆来顺受的奴隶？⁂- 4、是孩子给了我们做父母的机会，让我们成为更好的人。
  654: '**中毒者**：被毒教育毒害。例如，有人真的相信星座，这就是典型的中毒。⁂**解毒者**：自己消除毒教育对自己的错误影响。例如，真的相信科学的推理方法，自己得出结论：星座不靠谱。⁂**用毒者**：自己能用毒教育、甚至自己发展新形式的毒教育来教育别人，达到自己的目的。例如，你不相信星座，但你的合作对象相信，你就可以按星座解读把事情引向有利于你的方向。你以前中的毒，这时候都可以用上。⁂关于如何解毒，之前读的很多书都是在干这个事，例如《有钱人想的和你不一样》《你为什么是穷人》《不公平的优势》等等。'
  656: 问：那么，如何用毒呢？答：佛曰，不可说。以下省略一万字。
