book:
  title: 社会操控术
  subtitle: 脱离真实社会运转逻辑的思考都是耍流氓
  author: 佚名
  lang: zh-CN
preface: 本书由 OCR 文本重排：补章节层级、断句分段、清理图表乱码与网页水印、统一标点。文字沿用原文，未改写观点；原文残留的少量 OCR 错字另见校记。
front_matter: '# 出版说明


  > 本书为《社会操控术》的排版重制版：原稿来自 OCR，长段粘连、图表数据被拍成一串乱码。本版重排章节、按句断段、清理网页水印与图表残片，文字一律沿用原文。


  > 原书大量依赖口语化长句与举例，本版只做断句，不改语气。'
