chapters:
- title: 引子：到底是谁在左右你
  sections:
  - - 4
    - 是谁在左右你的心智
    - 有没有想过到底是谁在左右你的心智、思考、行为？——别告诉我说是你的心！那又是什么决定了你的心会这样思考，而不是那样思考呢？相信你在很多地方都看到过一些大佬的经典结论，“心有多大，世界就有多大”，“你的心是怎样的，你的世界就是怎样的”。类似的说法，你”之后，是什么感觉？是不是觉得很有道理，很受启发？相信大多数时候都是这样的感受。这些说法的确有道理，但从实操的角度来讲，还有点搓麻将三缺一的味道。
  - - 34
    - 高手如何让人心甘情愿被驾驭
    - 当心，当你认为自己很会“思考”时，你不知不觉正在成为别人的“盘中餐”下面重点来了。既然你的一切行为都是由概念在驱动，那高手是怎么做事的呢？
- title: 先立纲：别让脑袋被人偷走
  sections:
  - - 150
    - 对齐概念：先有共识，才有互动
    - 从这里开始，我会结合大量的案例来给大家讲解如何打开前面提到的人生“大结”：没有这些形成共识的概念，我们根本无法进行互动，怎么进行价值创造，有了这些概念认知呢，又会出现各种纠结、矛盾、冲突，那到底要还是不要呢？到底该怎么办呢？先说总的“思想纲领”，就是《首德》里面的一段话：“不尚贤，使民不争。不贵难得之货，使民不为盗。不见可欲，使民心不乱。是以圣人之治，虚其心，实其腹；弱其志，强其骨。常使民无知无欲。使大知者不敢为也。为无为，则无不治。”这段话是对皇帝说的治国之道。但是，我们把它放到自己身上来解决自己所面临的各种大大小小的现实问题，完全没问题，思路都是相通的。
- title: 高手为什么不动声色
  sections:
  - - 176
    - 淡定不是装的
    - 高手的淡定不是装的，而是识破这种真实的社会运转逻辑之后的必然需求越是处于社会上层的精英，越是精通这个原理。而越是精通这个原理的人，他就越能通过这个原理配合上纵横捭阖的手段来获取社会财富。
- title: 思维的两口大坑
  sections:
  - - 322
    - 思维大坑之一：情绪先行
    - 就是在解决问题时，往往是个人主观的、感性的情绪先行，而不是从基本事实出发。这是干扰我们理性、深入分问的非常普遍的一大障碍。
  - - 426
    - 思维大坑之二：主观偏好
    - 现在有两份工作摆在面前：
- title: 趋势与时机：未行而先胜
  sections:
  - - 766
    - 从现象里读出趋势的三个要领
    - 一个问题能不能被解决，一件事情能不能做成，“趋势”是首要的决定因素。看清楚趋势，而后乘势而上，能事半功倍。
  - - 970
    - 什么思维能让你踩准行动时机
- title: 盘清六种社会资源
  sections:
  - - 1054
    - 六种资源分别是什么
    - 解决任何问题，达成任何目标，必然绕不开的一个话题尤是资源。
- title: 运筹：让方案无懈可击
  sections:
  - - 1174
    - 从清单到方案
    - 前面已经从意志，趋势，时机，资源等维度上进行了各方面的信息采集、资源准备，那如何使用它们才能实现自己的目的呢？
