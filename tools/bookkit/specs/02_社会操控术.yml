manual:
  889: 一份 2020 年 4 月的行业投资分布数据：获得投资事件最多的是医疗健康、企业服务、智能硬件、汽车交通，文娱传媒、教育、房产服务都排在后面。资本流向实业，传媒不再是热钱的首选。
  897: 再看广告大盘：四大传统平台的广告营业额从 2013 年的 1,834.2 亿元到 2017 年的 1,784.65 亿元，整体在下滑；2014 年冲到 1,994.63 亿元的最高点后连续三年下滑，电视广告是下滑的核心。资本正在从传统媒体流出，传媒的趋势在走向衰颓。另一类是经营型资本，指的是通过企业经营产生的营收资本。
  949: 你看公众号、朋友圈里能够快速传播、引起巨大反响的，总是那些情感鸡汤、感动的、煽情的、卖惨的文字和视频。真正理性、烧脑、有含金量的内容，只能被晾在角落里。为什么会这样？就是因为共鸣。
  907: 数据来源：iResearch 与前瞻产业研究院的整理。
  909: 第三类是消费型资本。它是从消费者角度来定性的一类资本：在一个领域里，消费者的钱主要花在哪里，资本就往哪里聚。
